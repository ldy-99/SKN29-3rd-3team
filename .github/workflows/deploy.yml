name: Build and Deploy

on:
  pull_request:
    branches:
      - final
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - final
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: dongyoon99/frontend-react
  DJANGO_IMAGE: dongyoon99/django-backend
  FASTAPI_IMAGE: dongyoon99/fastapi-backend

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key
          DJANGO_DEBUG: "true"
          OPENAI_API_KEY: ci-placeholder-key
        run: |
          python -m pytest tests -q
          python django_backend/manage.py check
          python django_backend/manage.py test accounts strategy

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        working-directory: frontend-react
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          file: ./frontend-react/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: ./django_backend
          file: ./django_backend/Dockerfile
          push: true
          tags: |
            ${{ env.DJANGO_IMAGE }}:latest
            ${{ env.DJANGO_IMAGE }}:${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE }}:latest
            ${{ env.FASTAPI_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload production compose file
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/app"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/docker-compose.yml"

      - name: Deploy latest images
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -e
          cd ~/app
          rm -f .env
          cat > runtime.env << ENVEOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=a-fit.duckdns.org,43.201.113.124
          DJANGO_CORS_ALLOWED_ORIGINS=http://a-fit.duckdns.org
          DJANGO_CSRF_TRUSTED_ORIGINS=http://a-fit.duckdns.org
          FASTAPI_API_URL=http://fastapi-backend:8080
          FASTAPI_PROFILE_TIMEOUT=10
          FASTAPI_SIMULATE_TIMEOUT=30
          FASTAPI_CHATBOT_TIMEOUT=30
          FASTAPI_ANNOUNCEMENT_TIMEOUT=90
          FASTAPI_PDF_TIMEOUT=90
          DJANGO_SESSION_COOKIE_SECURE=false
          DJANGO_CSRF_COOKIE_SECURE=false
          ENVEOF
          docker compose pull
          docker compose up -d
          docker image prune -f
          docker compose ps
          EOF
